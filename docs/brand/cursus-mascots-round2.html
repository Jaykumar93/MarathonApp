<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursus logo and mascot options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{background:#E9E5DB;color:#0F1220;font:400 15px/1.5 Figtree,system-ui,sans-serif;padding:32px 24px 80px;overflow-x:hidden}
main{max-width:1240px;margin:0 auto}
h1{font:700 34px Bricolage Grotesque,sans-serif;letter-spacing:-.02em}
h2{font:700 26px Bricolage Grotesque,sans-serif;letter-spacing:-.02em;margin:48px 0 6px}
.sub{color:#5F626E;max-width:720px;margin:6px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px}
.card{background:#F4F1EA;border:1px solid rgba(15,18,32,.1);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font:700 18px Bricolage Grotesque,sans-serif;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font:500 11px 'Martian Mono',monospace;color:#5F626E;letter-spacing:.06em}
.card p{font-size:13px;color:#5F626E}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.t{border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:120px;padding:10px}
.t.l{background:#fff;border:1px solid rgba(15,18,32,.08)}
.t.d{background:#0F1220}
.t.i{background:#EDE9DF;flex-direction:column;gap:10px}
.lock{display:flex;align-items:center;gap:10px}
.wm{font:700 26px Bricolage Grotesque,sans-serif;letter-spacing:-.03em;line-height:1}
.icons{display:flex;align-items:flex-end;gap:10px}
.sq{border-radius:22%;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font:500 11px 'Martian Mono',monospace;border-radius:999px;padding:3px 10px;background:rgba(108,77,255,.12);color:#4B33C9;margin-right:6px}
.pick{background:#6C4DFF;color:#fff}
.mhero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.mini{display:flex;gap:6px}
.mini div{background:#fff;border:1px solid rgba(15,18,32,.08);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font:500 11px 'Martian Mono',monospace;color:#5F626E}
.herobox{background:#fff;border:1px solid rgba(15,18,32,.08);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:6px}
.row2{display:flex;gap:6px;flex-wrap:wrap}
</style>
<body>
<main>
<h1>Cursus mascots, round two</h1>
<p class="sub">Logo chosen: the profile line, the elevation line of a plan with a flag on the peak. These six mascots are built to sit beside it. Each shows easy, hard, max, resting and personal best.</p>
<div class="card" style="max-width:420px;margin-bottom:8px"><div class="tiles"><div class="t l"><div class="lock"><svg viewBox="0 0 100 100" width="44" height="44"><path d="M8 74L28 54L40 62L58 30L72 50L84 42L93 62" fill="none" stroke="#6C4DFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 30V12" stroke="#0F1220" stroke-width="3.5" stroke-linecap="round"/><path d="M58 12L74 18L58 24Z" fill="#0F1220"/></svg><span class="wm">cursus</span></div></div><div class="t d"><div class="lock"><svg viewBox="0 0 100 100" width="44" height="44"><path d="M8 74L28 54L40 62L58 30L72 50L84 42L93 62" fill="none" stroke="#8A72FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 30V12" stroke="#F4F1EA" stroke-width="3.5" stroke-linecap="round"/><path d="M58 12L74 18L58 24Z" fill="#F4F1EA"/></svg><span class="wm" style="color:#F4F1EA">cursus</span></div></div></div></div>
<div class="grid" id="mascots"></div>
</main>
<script>
const EYE=(x,y,r,p)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#fff"/><circle cx="'+(x+r*.2)+'" cy="'+(y+r*.25)+'" r="'+r*.5+'" fill="#0F1220"/>';
const FACE=(e,s)=>{const g=7*s,r=5.5*s,k='#0F1220';let o='';
 if(e==='easy')o=EYE(-g,0,r)+EYE(g,0,r)+'<path d="M'+-4*s+' '+9*s+'Q0 '+14*s+' '+4*s+' '+9*s+'" fill="none" stroke="'+k+'" stroke-width="'+2.2*s+'" stroke-linecap="round"/>';
 if(e==='hard')o=EYE(-g,1*s,r)+EYE(g,1*s,r)+'<path d="M'+-g*1.7+' '+-6*s+'L'+-g*.5+' '+-3*s+'M'+g*1.7+' '+-6*s+'L'+g*.5+' '+-3*s+'" stroke="'+k+'" stroke-width="'+2.2*s+'" stroke-linecap="round"/><path d="M'+-3*s+' '+11*s+'H'+3*s+'" stroke="'+k+'" stroke-width="'+2.2*s+'" stroke-linecap="round"/>';
 if(e==='max')o='<path d="M'+-g*1.6+' '+-1*s+'L'+-g*.5+' '+1*s+'M'+g*1.6+' '+-1*s+'L'+g*.5+' '+1*s+'" stroke="#fff" stroke-width="'+2.6*s+'" stroke-linecap="round"/><ellipse cx="0" cy="'+10*s+'" rx="'+4.2*s+'" ry="'+3.6*s+'" fill="'+k+'"/><path d="M'+g*2.3+' '+-8*s+'Q'+g*2.6+' '+-3*s+' '+g*2.3+' '+-1*s+'Q'+g*2+' '+-3*s+' '+g*2.3+' '+-8*s+'Z" fill="#7CC3D9"/>';
 if(e==='rest')o='<path d="M'+-g*1.6+' '+0+'Q'+-g+' '+4*s+' '+-g*.4+' '+0+'M'+g*.4+' '+0+'Q'+g+' '+4*s+' '+g*1.6+' '+0+'" fill="none" stroke="'+k+'" stroke-width="'+2.2*s+'" stroke-linecap="round"/><path d="M'+-3*s+' '+10*s+'Q0 '+12*s+' '+3*s+' '+10*s+'" fill="none" stroke="'+k+'" stroke-width="'+2*s+'" stroke-linecap="round"/><path d="M'+g*2+' '+-8*s+'h'+5*s+'l'+-5*s+' '+5*s+'h'+5*s+'" fill="none" stroke="#C9B8FF" stroke-width="'+2*s+'" stroke-linecap="round" stroke-linejoin="round"/>';
 if(e==='pb')o='<path d="M'+-g*1.6+' '+2*s+'Q'+-g+' '+-5*s+' '+-g*.4+' '+2*s+'M'+g*.4+' '+2*s+'Q'+g+' '+-5*s+' '+g*1.6+' '+2*s+'" fill="none" stroke="'+k+'" stroke-width="'+2.2*s+'" stroke-linecap="round"/><path d="M'+-5*s+' '+8*s+'Q0 '+18*s+' '+5*s+' '+8*s+'Z" fill="'+k+'"/><path d="M'+-g*2.4+' '+-9*s+'v'+6*s+'m'+-3*s+' '+-3*s+'h'+6*s+'M'+g*2.4+' '+-14*s+'v'+6*s+'m'+-3*s+' '+-3*s+'h'+6*s+'" stroke="#F2B705" stroke-width="'+2*s+'" stroke-linecap="round"/>';
 return o};
const FLAG=(x,y,h,col)=>'<path d="M'+x+' '+y+'V'+(y-h)+'" stroke="#4B33C9" stroke-width="3" stroke-linecap="round"/><path d="M'+x+' '+(y-h)+'L'+(x+16)+' '+(y-h+6)+'L'+x+' '+(y-h+12)+'Z" fill="'+col+'"/>';
const FL=e=>e==='pb'?'#F2B705':'#C9B8FF';
const BODY={
 ridge:e=>'<path d="M-62 36L-38 2L-22 16L-2 -22L18 6" fill="none" stroke="#5A3CE0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 4)"/><path d="M-62 36L-38 2L-22 16L-2 -22L18 6" fill="none" stroke="#6C4DFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M-38 -4L-22 10L-2 -28" fill="none" stroke="#8A72FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="40" cy="-2" r="26" fill="#6C4DFF"/><path d="M40 -2A26 26 0 0 1 66 -2A26 26 0 0 1 40 24C52 14 54 6 52 -2Z" fill="#5A3CE0" opacity=".0"/>'+FLAG(40,-26,18,FL(e))+'<g transform="translate(40 0)">'+FACE(e,1.15)+'</g>',
 goat:e=>'<path d="M-14 -34Q-30 -58 -12 -66" fill="none" stroke="#C9B8FF" stroke-width="9" stroke-linecap="round"/><path d="M14 -34Q30 -58 12 -66" fill="none" stroke="#C9B8FF" stroke-width="9" stroke-linecap="round"/><rect x="-24" y="38" width="12" height="16" rx="5" fill="#6C4DFF"/><rect x="12" y="38" width="12" height="16" rx="5" fill="#6C4DFF"/><rect x="-24" y="50" width="12" height="6" rx="3" fill="#0F1220"/><rect x="12" y="50" width="12" height="6" rx="3" fill="#0F1220"/><ellipse cx="0" cy="22" rx="32" ry="24" fill="#6C4DFF"/><ellipse cx="-26" cy="-22" rx="12" ry="6" fill="#8A72FF" transform="rotate(20 -26 -22)"/><ellipse cx="26" cy="-22" rx="12" ry="6" fill="#8A72FF" transform="rotate(-20 26 -22)"/><circle cx="0" cy="-14" r="24" fill="#8A72FF"/><path d="M-6 8L0 26L6 8Z" fill="#C9B8FF"/><path d="M-30 6Q0 18 30 6L30 16Q0 28 -30 16Z" fill="#F2B705"/><g transform="translate(0 -12)">'+FACE(e,1.1)+'</g>',
 pika:e=>'<circle cx="-24" cy="-26" r="14" fill="#8A72FF"/><circle cx="24" cy="-26" r="14" fill="#8A72FF"/><circle cx="-24" cy="-26" r="7" fill="#C9B8FF"/><circle cx="24" cy="-26" r="7" fill="#C9B8FF"/><ellipse cx="0" cy="12" rx="40" ry="36" fill="#8A72FF"/><ellipse cx="0" cy="26" rx="22" ry="18" fill="#C9B8FF"/><ellipse cx="-16" cy="48" rx="11" ry="5" fill="#6C4DFF"/><ellipse cx="16" cy="48" rx="11" ry="5" fill="#6C4DFF"/><path d="M38 24V-8" stroke="#4B33C9" stroke-width="3" stroke-linecap="round"/><path d="M38 -8L54 -2L38 4Z" fill="'+FL(e)+'"/><circle cx="36" cy="22" r="6" fill="#8A72FF"/><g transform="translate(0 0)">'+FACE(e,1.15)+'</g>',
 yeti:e=>'<ellipse cx="-20" cy="52" rx="16" ry="7" fill="#8A72FF"/><ellipse cx="20" cy="52" rx="16" ry="7" fill="#8A72FF"/><path d="M-36 40C-44 10-40 -30-18 -44L-8 -52L0 -44L8 -52L18 -44C40 -30 44 10 36 40Z" fill="#EFEAFF" stroke="#8A72FF" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="-42" cy="14" rx="9" ry="16" fill="#EFEAFF" stroke="#8A72FF" stroke-width="3.5"/><ellipse cx="42" cy="14" rx="9" ry="16" fill="#EFEAFF" stroke="#8A72FF" stroke-width="3.5"/><ellipse cx="0" cy="-14" rx="26" ry="22" fill="#6C4DFF"/><path d="M-14 24Q0 32 14 24M-12 34Q0 42 12 34" fill="none" stroke="#C9B8FF" stroke-width="3" stroke-linecap="round"/><g transform="translate(0 -14)">'+FACE(e,1.15)+'</g>',
 sole:e=>'<path d="M-50 22V-4C-50 -14-42 -18-34 -13L-14 -2L10 -30C14 -36 22 -36 26 -30L46 12C50 18 46 24 38 24H-44Z" fill="#6C4DFF"/><path d="M10 -30C14 -36 22 -36 26 -30L46 12C50 18 46 24 38 24H22C26 4 20 -14 10 -30Z" fill="#5A3CE0"/><rect x="-54" y="22" width="104" height="13" rx="6.5" fill="#E4DDFF" stroke="#8A72FF" stroke-width="2"/><path d="M-54 30H50" stroke="#C9B8FF" stroke-width="3"/><path d="M-12 -4L-4 4M-4 -12L4 -4M4 -20L12 -12" stroke="#C9B8FF" stroke-width="3" stroke-linecap="round"/><path d="M-44 14Q-10 4 30 16" fill="none" stroke="#8A72FF" stroke-width="5" stroke-linecap="round"/>'+FLAG(18,-34,16,FL(e))+'<g transform="translate(-24 0)">'+FACE(e,1)+'</g>',
 marmot:e=>'<path d="M40 44V-34" stroke="#4B33C9" stroke-width="3" stroke-linecap="round"/><path d="M40 -34L58 -27L40 -20Z" fill="'+FL(e)+'"/><ellipse cx="-14" cy="52" rx="12" ry="5.5" fill="#6C4DFF"/><ellipse cx="14" cy="52" rx="12" ry="5.5" fill="#6C4DFF"/><ellipse cx="0" cy="22" rx="30" ry="32" fill="#8A72FF"/><ellipse cx="0" cy="28" rx="17" ry="22" fill="#C9B8FF"/><circle cx="-18" cy="-38" r="8" fill="#8A72FF"/><circle cx="18" cy="-38" r="8" fill="#8A72FF"/><circle cx="0" cy="-16" r="26" fill="#8A72FF"/><ellipse cx="0" cy="-6" rx="14" ry="10" fill="#C9B8FF" opacity=".55"/><circle cx="36" cy="14" r="8" fill="#8A72FF"/><g transform="translate(0 -18)">'+FACE(e,1.1)+'</g>'
};
const MASC=[
 ['ridge','Ridge, the living profile line','The logo as a character','The elevation line from the logo, alive: a thick zigzag body with a round head and a flag. It is the logo and the mascot at once.','Closest to the chosen logo. A line is harder to give a pose.'],
 ['goat','Alp, the mountain goat','Built for climbing','A confident goat with swept-back horns and a golden pace-band scarf. Mountains, steady footing and a quiet "greatest of all time" joke for personal bests.','Strong silhouette. Horns need care so they don\'t read as devil horns.'],
 ['pika','Pika, the little climber','Tiny, round, and cheerful','A round alpine pika holding its own flag. Very easy to like, and tiny things are easy to animate.','Cutest. Least athletic.'],
 ['yeti','Yeti, the gentle giant','Big, shaggy, kind','A white yeti with a violet face and fur tufts on its head. Reads as strong but never aggressive.','Most character. Complex to draw well at small sizes.'],
 ['sole','Sole, the running shoe','The only thing that runs','A running shoe with a face and a flag on the heel. Instantly about running.','Clearest meaning. Shoe mascots are common in the category.'],
 ['marmot','Marmot, the lookout','Standing guard on the summit','A chubby marmot standing up with a flag, the way marmots watch a valley. Calm, curious and a little funny.','Warm and unusual. Not obviously about running.']
];

const mg=(k,e,sz)=>'<svg viewBox="-75 -85 150 150" width="'+sz+'" height="'+sz+'" role="img" aria-label="'+k+' '+e+'">'+BODY[k](e)+'</svg>';
const EX=[['hard','hard'],['max','max'],['rest','rest'],['pb','best']];
document.getElementById('mascots').innerHTML=MASC.map((m,i)=>'<div class="card"><h3>'+m[1]+'<small>'+String(i+1).padStart(2,'0')+'</small></h3><div class="mhero"><div class="herobox">'+mg(m[0],'easy',140)+'</div><div><p><b style="color:#0F1220">'+m[2]+'.</b> '+m[3]+'</p></div></div><div class="mini">'+EX.map(x=>'<div>'+mg(m[0],x[0],68)+x[1]+'</div>').join('')+'</div><p>'+m[4]+'</p></div>').join('');
</script>
</body>
</html>
